name: Daily Prediction Update
on:
  schedule:
    - cron: '00 18 * * *'  # Runs daily at 23:30 IST (18:00 UTC)
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: false

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python packages
      run: |
        pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt

    - name: Run prediction script
      run: python src/Electricity_Demand_Prediction.py
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}

    - name: Pull latest changes before pushing
      run: |
        git fetch origin master
        git reset --soft origin/master

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add .
        if ! git diff-index --quiet HEAD; then
          git commit -m "Auto-update: New predictions $(date +'%Y-%m-%d')"
          git pull origin master --rebase
          git push
        else
          echo "No new data changes detected today. Skipping commit."
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
