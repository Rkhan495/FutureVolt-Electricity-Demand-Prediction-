name: One-Off Dedupe CSV and JSON

on:
  workflow_dispatch:

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python packages
      run: |
        pip install --upgrade pip
        pip install pandas

    - name: Run dedupe script
      run: python src/dedupe_csv_json.py

    - name: Commit and push cleaned files
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add data/All_Data.csv data/data.json
        if ! git diff-index --quiet HEAD; then
          git commit -m "Dedupe All_Data.csv and regenerate data.json"
          git push
        else
          echo "No changes to commit."
        fi
